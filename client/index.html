<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>컬러 버스트</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
<div id="app">
  <div class="top">
    <div class="brand">컬러 <b>버스트</b><span class="badge" id="stageBadge" hidden></span></div>
    <span class="roomtag" id="roomTag" hidden></span>
    <button class="iconbtn" id="pauseBtn" type="button" aria-label="일시정지" hidden>일시정지</button>
    <span class="ping" id="ping" hidden></span>
    <button class="iconbtn" id="codexTop" type="button" aria-label="도감">도감</button>
    <button class="iconbtn" id="leaveTop" type="button" aria-label="게임 나가기" hidden>나가기</button>
    <button class="iconbtn" id="settingsBtn" type="button" aria-controls="settingsPanel" aria-label="설정">설정</button>
    <span class="roundtag" id="roundTag" hidden></span>
    <div class="timer" id="timer">60</div>
  </div>
  <div class="scores" id="scores"></div>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="combobar" id="comboBar" aria-label="내 완성 조합"></div>
    <div class="buffs" id="buffs" aria-label="내 아이템 효과"></div>
    <div class="itempops" id="itemPops" aria-hidden="true"></div>
    <div class="feed" id="feed" aria-live="polite"></div>

    <!-- 1. 처음 화면 -->
    <div class="overlay" id="home">
      <div class="card">
        <h1>컬러 <span>버스트</span></h1>
        <p>중앙에서 터져 나오는 원을 친구들과 동시에 노리는 4인 클릭 게임이에요. 방을 만들어 코드를 공유하거나, 받은 코드로 들어가세요.</p>
        <label class="lbl" for="nameInput">닉네임</label>
        <input class="field" id="nameInput" maxlength="12" placeholder="예: 반가워" autocomplete="nickname">
        <div class="row">
          <button class="btn grow" id="createBtn" type="button">방 만들기</button>
          <button class="btn ghost grow" id="soloBtn" type="button">혼자 하기</button>
        </div>
        <p class="hint" id="taBest" hidden></p>
        <div class="row">
          <input class="field code" id="codeInput" maxlength="4" placeholder="방 코드" autocomplete="off">
          <button class="btn ghost" id="joinBtn" type="button">입장</button>
        </div>
        <p class="err" id="homeErr" role="alert"></p>
        <div class="btnrow">
          <button class="btn ghost small iconlbl" id="guideBtn" type="button">게임 방법</button>
          <button class="btn ghost small iconlbl" id="codexBtn" type="button">도감</button>
        </div>
        <p class="ver" id="ver"></p>
      </div>
    </div>

    <!-- 2. 대기실 -->
    <div class="overlay" id="lobby" hidden>
      <div class="card">
        <div id="codeBlock">
          <div class="lbl">방 코드 (친구에게 알려 주세요)</div>
          <div class="bigcode" id="lobbyCode">----</div>
        </div>
        <h1 id="soloTitle" hidden>혼자 <span>하기</span></h1>
        <h1 id="taTitle" hidden>타임<span>어택</span></h1>
        <div class="lbl">내 색상</div>
        <div class="picks" id="picks"></div>
        <div id="membersBox">
          <div class="lbl">참가자</div>
          <div class="members" id="members"></div>
        </div>
        <div id="hostOpts" class="opts">
          <label class="check" id="fillBotsRow"><input type="checkbox" id="fillBots" checked> 빈 자리는 봇으로 채우기</label>
          <div class="seg" id="botLevel"></div>
        </div>
        <div id="rulesBox" class="rulesbox"></div>
        <button class="btn" id="startBtn" type="button">게임 시작</button>
        <button class="btn" id="readyBtn" type="button" hidden>준비</button>
        <p class="hint" id="lobbyHint"></p>
        <p class="err" id="lobbyErr" role="alert"></p>
        <div class="btnrow">
          <button class="btn ghost small iconlbl" id="guideBtn2" type="button">게임 방법</button>
          <button class="btn ghost small iconlbl" id="codexBtn2" type="button">도감</button>
          <button class="btn ghost small iconlbl danger" id="leaveBtn" type="button">방 나가기</button>
        </div>
      </div>
    </div>

    <!-- 3. 결과 -->
    <div class="overlay" id="result" hidden>
      <div class="card wide">
        <h1 id="resTitle">결과</h1>
        <div class="rank" id="rank"></div>
        <div id="titleList"></div>
        <div id="graphBox"></div>
        <div id="srcBox"></div>
        <button class="btn" id="rematchBtn" type="button">한 판 더</button>
        <button class="btn ghost" id="toLobbyBtn" type="button">대기실로</button>
        <p class="hint" id="resultHint"></p>
      </div>
    </div>

    <div class="countdown" id="countdown" hidden></div>
    <div class="roundend" id="roundEnd" hidden>라운드 종료!</div>
    <div class="outbanner" id="outBanner" hidden>탈락 · 구경 중</div>
    <div class="pattag" id="patternTag" hidden></div>
    <div class="settings" id="settingsPanel" role="dialog" aria-label="설정" hidden>
      <div class="set-head"><b>설정</b><button class="iconbtn x" id="settingsClose" type="button" aria-label="닫기">닫기</button></div>
      <label class="set-row" for="setMusic"><span>배경음악</span><input type="range" id="setMusic" min="0" max="100" step="5"><em id="setMusicVal"></em></label>
      <label class="set-row" for="setSfx"><span>효과음</span><input type="range" id="setSfx" min="0" max="100" step="5"><em id="setSfxVal"></em></label>
      <label class="set-row" for="setSens"><span>마우스 감도</span><input type="range" id="setSens"><em id="setSensVal"></em></label>
      <p class="set-note">1.0이 아니면 게임 중 마우스를 잠가요. Esc로 풀고, 판을 클릭하면 다시 잠가요. <button class="linkbtn" id="setSensReset" type="button">기본값</button></p>
      <label class="set-row check" for="setMute"><span>전체 음소거 <kbd>M</kbd></span><input type="checkbox" id="setMute"></label>
      <label class="set-row check" for="setFx"><span>화면 효과 줄이기</span><input type="checkbox" id="setFx"></label>
      <label class="set-row check" for="setPing"><span>핑(지연) 표시</span><input type="checkbox" id="setPing"></label>
      <button class="btn ghost small" id="setFullscreen" type="button">전체 화면</button>
    </div>
    <div class="overlay" id="pickOv" hidden></div>
    <div class="overlay" id="pauseOv" hidden>
      <div class="card center">
        <h1>일시정지</h1>
        <p id="pauseWho"></p>
        <p class="hint" id="pauseLeft" hidden></p>
        <button class="btn" id="resumeBtn" type="button">계속하기</button>
        <button class="btn ghost danger" id="pauseLeaveBtn" type="button">게임 나가기</button>
        <p class="hint">Esc 또는 P 키로도 멈추고 다시 할 수 있어요</p>
      </div>
    </div>
    <div class="netbanner" id="netBanner" role="status" hidden>연결이 끊겼어요. 다시 연결하는 중…</div>
  </div>

  <div class="bottom">
    <div class="flabel" id="flabel">피버</div>
    <div class="meter"><i id="meterFill"></i></div>
    <div class="combo c1" id="combo" aria-label="콤보"><b>0</b><span>콤보</span></div>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
