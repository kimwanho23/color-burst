# Render 배포 설정 (Blueprint)
# Render 대시보드 → New → Blueprint → 이 저장소 선택하면 아래 설정으로 서버가 만들어진다.
services:
  - type: web
    name: color-burst
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
